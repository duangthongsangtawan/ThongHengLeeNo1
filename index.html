<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thong Heng Lee Portal</title>
<meta name="description" content="ท่งเฮงหลี · 同興利 · Thong Heng Lee — ร้านอาหารไทยในชุมชนท่าช้าง ดูเมนูและสั่งอาหารได้จากโต๊ะ">
<meta property="og:title" content="Thong Heng Lee (ท่งเฮงหลี)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Myanmar:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&family=Noto+Serif+TC:wght@500;700&family=Noto+Serif+SC:wght@500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/images/logo.jpg">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  /* ================= Opening animation ================= */
  body.intro-lock { overflow: hidden; }
  .intro { position: fixed; inset: 0; z-index: 100; background: #E2A838; overflow: hidden; cursor: pointer; transition: opacity 0.6s ease 0.55s; }
  .intro[hidden] { display: none; }
  .intro .stage {
    position: absolute; left: 50%; top: 50%;
    width: max(100vw, calc(100dvh * 10 / 7)); aspect-ratio: 10 / 7;
    transform: translate(-50%, -50%) scale(1); transform-origin: 50% 66%;
    transition: transform 1.15s cubic-bezier(.55, 0, .35, 1);
  }
  .intro .facade { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* Sino-Portuguese shophouse folding doors (บานเฟี้ยม): two leaves per side, each a solid 3-D slab.
     The outer leaf hangs on iron pintles in the jamb; the inner leaf hangs on the outer leaf.
     Opening: the inner leaf folds back onto the outer one, then the pair swings out flat against the facade. */
  .intro .stage { --t: calc(max(100vw, 100dvh * 10 / 7) * 0.0065); } /* leaf thickness, scales with the stage */
  .doors { position: absolute; left: 38%; top: 41.43%; width: 24%; height: 50%; perspective: 1100px; }
  .leaf { position: absolute; top: 0; bottom: 0; width: 25%; transform-style: preserve-3d; }
  .leaf > .in, .leaf.in { width: 100%; }
  .doors > .leaf-l { left: 0; transform-origin: 0 50% 0; transition: transform 1.1s cubic-bezier(.55, .05, .3, 1) .5s; }
  .doors > .leaf-r { right: 0; transform-origin: 100% 50% 0; transition: transform 1.1s cubic-bezier(.55, .05, .3, 1) .38s; }
  .leaf-l > .in { left: 100%; transform-origin: 0 50% calc(var(--t) * -1); transition: transform .8s cubic-bezier(.5, 0, .3, 1) .12s; }
  .leaf-r > .in { right: 100%; transform-origin: 100% 50% calc(var(--t) * -1); transition: transform .8s cubic-bezier(.5, 0, .3, 1); }
  .intro.open .doors > .leaf-l { transform: rotateY(-180deg); }
  .intro.open .leaf-l > .in { transform: rotateY(180deg); }
  .intro.open .doors > .leaf-r { transform: rotateY(180deg); }
  .intro.open .leaf-r > .in { transform: rotateY(-180deg); }
  .leaf .face, .leaf .edge { position: absolute; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .leaf .face { inset: 0; }
  .leaf .front {
    background: linear-gradient(90deg, rgba(0,0,0,0.10), rgba(255,255,255,0.06) 50%, rgba(0,0,0,0.10)), #5A94B8;
    box-shadow: inset 0 0 0 1.5px #335F7C;
  }
  .leaf-l > .in > .front { transform: translateZ(1px); } /* carries the astragal over the right-hand leaf */
  /* upper louvres */
  .leaf .front::before {
    content: ""; position: absolute; left: 17%; right: 17%; top: 6%; height: 45%;
    background: repeating-linear-gradient(180deg, #6FA6C9 0 2.4%, #3F7699 2.4% 3.4%, #4E86AA 3.4% 4.3%);
    box-shadow: 0 0 0 2px #3F7699, inset 0 3px 3px rgba(0,0,0,0.25);
  }
  /* lower raised (fielded) panel */
  .leaf .front::after {
    content: ""; position: absolute; left: 17%; right: 17%; bottom: 6%; height: 36%;
    background: linear-gradient(#5A94B8, #4E86AA) center / 58% 76% no-repeat, linear-gradient(135deg, #78AECF, #3F7699);
    box-shadow: 0 0 0 2px #3F7699;
  }
  .leaf .back {
    transform: translateZ(calc(var(--t) * -1)) rotateY(180deg);
    background: repeating-linear-gradient(90deg, #4A82A4 0 31%, #3B6F8F 31% 33.3%), #4A82A4;
    box-shadow: inset 0 0 0 1.5px #335F7C;
  }
  /* iron strap hinges on the inside face, on the hinge side */
  .leaf-l .back, .leaf-r .back { --strap: linear-gradient(#2B2F33, #2B2F33); }
  .leaf-l > .back, .leaf-l > .in > .back { background-image: var(--strap), var(--strap), var(--strap), repeating-linear-gradient(90deg, #4A82A4 0 31%, #3B6F8F 31% 33.3%); background-size: 60% 3.5%, 60% 3.5%, 60% 3.5%, auto; background-position: 100% 11%, 100% 50%, 100% 89%, 0 0; background-repeat: no-repeat, no-repeat, no-repeat, repeat; }
  .leaf-r > .back, .leaf-r > .in > .back { background-image: var(--strap), var(--strap), var(--strap), repeating-linear-gradient(90deg, #4A82A4 0 31%, #3B6F8F 31% 33.3%); background-size: 60% 3.5%, 60% 3.5%, 60% 3.5%, auto; background-position: 0 11%, 0 50%, 0 89%, 0 0; background-repeat: no-repeat, no-repeat, no-repeat, repeat; }
  /* the leaf's thickness: side edges, with hinge knuckles banded in iron */
  .leaf .edge {
    top: 0; bottom: 0; width: var(--t);
    background:
      linear-gradient(#2B2F33, #2B2F33) 0 11% / 100% 5% no-repeat,
      linear-gradient(#2B2F33, #2B2F33) 0 50% / 100% 5% no-repeat,
      linear-gradient(#2B2F33, #2B2F33) 0 89% / 100% 5% no-repeat,
      linear-gradient(90deg, #2F5E7B, #3C6F8E);
  }
  .leaf .e0 { right: 100%; transform-origin: 100% 50%; transform: rotateY(-90deg); }
  .leaf .e1 { left: 100%; transform-origin: 0 50%; transform: rotateY(90deg); }
  /* hardware on the street face */
  .leaf .hw { position: absolute; top: 0; bottom: 0; width: 11%;
    background: linear-gradient(#2B2F33, #2B2F33) 0 11% / 100% 6% no-repeat, linear-gradient(#2B2F33, #2B2F33) 0 50% / 100% 6% no-repeat, linear-gradient(#2B2F33, #2B2F33) 0 89% / 100% 6% no-repeat; }
  .leaf-l > .front .hw { left: -4%; }
  .leaf-r > .front .hw { right: -4%; }
  .leaf .ring { position: absolute; top: 53%; width: 13%; aspect-ratio: 1; border: 2px solid #E2C06A; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,0.45); }
  .leaf-l .ring { right: 9%; }
  .leaf-r .ring { left: 9%; }
  .leaf .astragal { position: absolute; top: 0; bottom: 0; left: 100%; width: 7%; background: #4E86AA; box-shadow: inset 1px 0 rgba(255,255,255,0.3), 1px 0 2px rgba(0,0,0,0.35); }
  /* parked tuk-tuk: the body shivers on its springs while the engine idles, exhaust puffs drift off */
  .intro .tt-body { animation: ttIdle .16s ease-in-out infinite alternate; }
  .intro .puff { opacity: 0; transform-box: fill-box; transform-origin: center; animation: ttPuff 1.5s ease-out infinite; }
  .intro .puff.p2 { animation-delay: .5s; }
  .intro .puff.p3 { animation-delay: 1s; }
  @keyframes ttIdle { to { transform: translateY(-0.8px); } }
  @keyframes ttPuff { 0% { opacity: 0; transform: translate(0, 0) scale(.5); } 20% { opacity: .65; } 100% { opacity: 0; transform: translate(24px, -18px) scale(2.1); } }
  .intro.enter .stage { transform: translate(-50%, -50%) scale(3.4); }
  .intro.enter { opacity: 0; }
  .intro .glow { opacity: 0.35; transition: opacity 1.4s ease 0.4s; }
  .intro.open .glow { opacity: 1; }
  .intro-caption {
    position: absolute; left: 50%; bottom: max(4vh, 18px); transform: translateX(-50%);
    padding: 10px 20px; border-radius: 999px; background: rgba(58,36,20,0.82); color: var(--ivory);
    font-family: var(--font-display); font-size: clamp(1rem, 2.6vw, 1.4rem); white-space: nowrap;
    transition: opacity 0.4s;
  }
  .intro.enter .intro-caption { opacity: 0; }
  .skip { position: absolute; top: 16px; right: 16px; z-index: 2; border: 0; padding: 10px 16px; border-radius: 999px; background: rgba(58,36,20,0.75); color: var(--ivory); font-weight: 600; }
  .skip:hover { background: var(--teak-dark); }

  /* ================= Hero ================= */
  .hero {
    position: relative; margin-top: 20px; color: var(--ivory); overflow: hidden; border-radius: 22px;
    background:
      linear-gradient(100deg, rgba(58,36,20,0.95) 0%, rgba(92,58,33,0.86) 55%, rgba(92,58,33,0.55) 100%),
      url("assets/images/storefront.jpg") center / cover no-repeat,
      var(--teak);
    border: 3px solid var(--teak);
  }
  .hero::before { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(226,168,56,0.6); border-radius: 14px; pointer-events: none; }
  .hero-grid { position: relative; display: grid; gap: 8px; padding: 38px 24px 26px; align-items: center; }
  @media (min-width: 860px) { .hero-grid { grid-template-columns: 1.2fr 1fr; padding: 48px 56px 36px; } }
  .eyebrow { display: flex; align-items: flex-start; gap: 10px; color: var(--ochre-hi); font-size: 0.92rem; font-weight: 500; line-height: 1.5; margin: 0 0 16px; max-width: 520px; }
  .eyebrow::before { content: ""; flex: none; width: 28px; height: 2px; background: var(--ochre); margin-top: 0.7em; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 5vw, 3.3rem); line-height: 1.12; margin: 0; text-wrap: balance; }
  .trilingual { margin: 16px 0 0; font-size: 1rem; color: rgba(247,242,231,0.75); display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .trilingual span { font-family: 'Noto Serif Thai', 'Noto Serif TC', 'Fraunces', serif; }
  .trilingual span + span::before { content: "·"; margin-right: 14px; color: var(--ochre); }
  .lede { max-width: 520px; margin: 18px 0 0; font-size: 1.05rem; line-height: 1.6; color: rgba(247,242,231,0.9); }

  /* ================= Floating chatbot ================= */
  .stage-bot { position: relative; display: flex; justify-content: center; padding-top: 78px; }
  .bubble {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    max-width: min(300px, 88%); width: max-content; min-height: 46px;
    background: #FFFFFF; color: var(--ink); padding: 12px 18px; font-size: 1rem; font-weight: 500; line-height: 1.4;
    border-radius: 20px; box-shadow: 0 10px 28px rgba(0,0,0,0.32), 0 0 0 2px rgba(226,168,56,0.6); text-align: center; z-index: 2;
  }
  .bubble:empty { visibility: hidden; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 16px; height: 16px; background: #FFFFFF; border-radius: 0 0 4px 0; transform: translateX(-50%) rotate(45deg); }
  .bubble.pop { animation: pop 0.35s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { from { transform: translateX(-50%) scale(0.7); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
  .dots { display: inline-flex; gap: 5px; padding: 6px 4px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: #9AA3B2; animation: dot 0.9s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: 0.15s; } .dots i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes dot { 0%,100% { transform: translateY(0); opacity: 0.5; } 40% { transform: translateY(-5px); opacity: 1; } }

  .mascot { background: none; border: 0; padding: 0; width: min(285px, 64vw); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .mascot svg { display: block; width: 100%; height: auto; overflow: visible; }
  .mascot svg * { transform-box: view-box; }
  .float    { animation: float 3.6s ease-in-out infinite; }
  .shadow   { transform-origin: 120px 248px; animation: shadow 3.6s ease-in-out infinite; }
  .hand-l   { transform-origin: 64px 186px; animation: handFloat 3.6s ease-in-out 0.25s infinite; }
  .hand-r   { transform-origin: 176px 186px; animation: handFloat 3.6s ease-in-out 0.5s infinite; }
  .eyes     { transform-origin: 120px 100px; animation: blink 5s infinite; }
  .eye-happy, .mouth-open { opacity: 0; }
  .ear-light { animation: earGlow 2.4s ease-in-out infinite; }
  .happy .eye-open { opacity: 0; }
  .happy .eye-happy { opacity: 1; }
  .talking .mouth-open { animation: talk 0.22s steps(1) infinite; }
  .talking .mouth-smile { animation: talk 0.22s steps(1) infinite reverse; }
  .waving .hand-l { animation: waveHand 0.45s ease-in-out 5 alternate; }
  .dish-ic { opacity: 0; animation: dishCycle 9s infinite; }
  .dish-ic.d2 { animation-delay: 3s; } .dish-ic.d3 { animation-delay: 6s; }
  @keyframes float     { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes shadow    { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.78); opacity: 0.6; } }
  @keyframes handFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes waveHand  { from { transform: translate(-6px, -62px) rotate(-22deg); } to { transform: translate(-6px, -62px) rotate(18deg); } }
  @keyframes blink     { 0%,93%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
  @keyframes earGlow   { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
  @keyframes talk      { 0% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes dishCycle { 0% { opacity: 0; } 4%,30% { opacity: 1; } 34%,100% { opacity: 0; } }
  .hint { text-align: center; font-size: 0.8rem; color: rgba(247,242,231,0.65); margin: 6px 0 0; }

  /* ================= Customer entry + favourites ================= */
  .entry { display: grid; gap: 20px; margin-top: 26px; }
  @media (min-width: 900px) { .entry { grid-template-columns: 1fr 1fr; align-items: stretch; } }

  .cust-card {
    position: relative; display: flex; flex-direction: column; gap: 16px; padding: 30px 26px 28px; text-decoration: none;
    background: var(--paper); border: 3px solid var(--teak); border-radius: 22px; box-shadow: 0 6px 0 var(--teak);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .cust-card:hover { transform: translateY(-3px); box-shadow: 0 9px 0 var(--teak); }
  .cust-card:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--teak); }
  .cust-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 10px; border-radius: 19px 19px 0 0; background: repeating-linear-gradient(90deg, var(--sky) 0 26px, var(--ivory) 26px 30px); }
  .cust-icon { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--sky-soft); color: var(--sky-deep); margin-top: 6px; }
  .cust-tag { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--sky-deep); }
  .cust-card h2 { margin: 0; font-family: var(--font-display); font-size: clamp(1.6rem, 3.4vw, 2.15rem); line-height: 1.22; color: var(--teak-dark); }
  .cust-card .desc { margin: 0; line-height: 1.6; color: rgba(43,29,20,0.8); }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .steps li { display: flex; align-items: center; gap: 10px; font-weight: 500; }
  .steps li b { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--ochre); color: var(--teak-dark); font-size: 0.85rem; }
  .cust-card .btn-primary { align-self: stretch; margin-top: auto; padding: 18px 22px; font-size: 1.15rem; justify-content: space-between; }
  .cust-card .btn-primary .arrow { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--teak-dark); color: var(--ochre-hi); transition: transform 0.2s; }
  .cust-card:hover .btn-primary .arrow { transform: translateX(4px); }

  .fav-card { display: flex; flex-direction: column; background: var(--paper); border: 3px solid var(--teak); border-radius: 22px; overflow: hidden; box-shadow: 0 6px 0 rgba(92,58,33,0.35); }
  .fav-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 22px 14px; }
  .fav-head h2 { margin: 0; font-family: var(--font-display); font-size: 1.35rem; color: var(--teak-dark); }
  .fav-head span { text-align: end; font-size: 0.8rem; font-weight: 700; color: var(--teak-dark); background: var(--ochre); padding: 4px 10px; border-radius: 999px; }
  .fav-grid { flex: 1; display: grid; grid-template-columns: 1.25fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; padding: 0 6px 6px; min-height: 320px; }
  .fav { position: relative; display: block; margin: 0; overflow: hidden; border-radius: 14px; background: var(--ivory-2); text-decoration: none; }
  .fav:first-child { grid-row: span 2; }
  .fav img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.6s cubic-bezier(.2,.7,.2,1); }
  .fav:hover img, .fav:focus-visible img { transform: scale(1.1); }
  /* The next photo fades in on top of the current one (see "House favourites" in the script). */
  .fav img.fav-in { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease; }
  .fav img.fav-in.on { opacity: 1; }
  .fav .cap > span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  @media (prefers-reduced-motion: reduce) { .fav img.fav-in { transition: none; } }
  .fav .cap { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 28px 12px 10px; font-weight: 700; color: #fff; background: linear-gradient(transparent, rgba(43,29,20,0.82)); }
  .fav .cap::after { content: "+"; flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--ochre); color: var(--teak-dark); font-size: 1.1rem; }
  @media (max-width: 899px) { .fav-grid { min-height: 0; aspect-ratio: 5 / 4; } }

  #languageSetup { width: min(430px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow-y:auto; box-sizing:border-box; padding:28px; border:1px solid var(--hairline); border-radius:20px; background:var(--paper); color:var(--teak-dark); box-shadow:0 24px 80px #241b1640; }
  #languageSetup::backdrop { background:#241b1699; backdrop-filter:blur(5px); }
  #languageSetup.fallback { display:block; position:fixed; inset:0; margin:auto; z-index:10000; }
  .language-welcome { font-size:.7rem; letter-spacing:.2em; color:var(--teak); }
  #languageHeading { margin:12px 0 24px; font-size:1.55rem; line-height:1.4; }
  #languageHeading span { display:block; font-size:1rem; font-weight:400; }
  .language-choices { display:flex; flex-direction:column; gap:8px; }
  .language-choices button { display:flex; justify-content:space-between; align-items:center; gap:16px; width:100%; min-height:50px; padding:12px 16px; border:1px solid var(--hairline); border-radius:10px; background:#fff9; color:var(--teak-dark); text-align:left; cursor:pointer; font:inherit; }
  .language-choices button span { font-size:.8rem; opacity:.75; }
  .language-choices button:hover, .language-choices button[aria-pressed="true"] { background:var(--sky-soft); border-color:var(--sky-deep); }
  .language-choices button:focus-visible { outline:3px solid var(--sky-deep); outline-offset:2px; }

</style>
</head>
<body>
<dialog id="languageSetup" aria-labelledby="languageHeading">
  <div class="language-welcome">THONG HENG LEE</div>
  <h2 id="languageHeading">Select your language <span lang="th">(กรุณาเลือกภาษา)</span></h2>
  <div class="language-choices"><button type="button" data-language-choice="th" lang="th"><strong>ไทย</strong><span>Thai</span></button><button type="button" data-language-choice="en" lang="en"><strong>English</strong><span>English</span></button><button type="button" data-language-choice="zh-Hans" lang="zh-Hans"><strong>简体中文</strong><span>Chinese</span></button><button type="button" data-language-choice="ja" lang="ja"><strong>日本語</strong><span>Japanese</span></button><button type="button" data-language-choice="ko" lang="ko"><strong>한국어</strong><span>Korean</span></button><button type="button" data-language-choice="my" lang="my"><strong>မြန်မာ</strong><span>Burmese</span></button><button type="button" data-language-choice="id" lang="id"><strong>Bahasa Indonesia</strong><span>Indonesian</span></button><button type="button" data-language-choice="fr" lang="fr"><strong>Français</strong><span>French</span></button><button type="button" data-language-choice="es" lang="es"><strong>Español</strong><span>Spanish</span></button></div>
</dialog>


<!-- ================= Opening animation ================= -->
<div class="intro" id="intro" hidden>
  <div class="stage">
    <svg class="facade" viewBox="0 0 1000 700" aria-hidden="true">
      <defs>
        <pattern id="rust" width="1000" height="28" patternUnits="userSpaceOnUse"><path d="M0 27.5 H1000" stroke="#D29A30" stroke-width="1.5" opacity="0.55"/></pattern>
        <!-- turned balusters, as on the balcony in the photos -->
        <pattern id="bal" width="24" height="52" patternUnits="userSpaceOnUse" y="72">
          <path d="M8 0 H16 V4 Q20 8 17 14 Q13 20 15 28 Q21 36 18 44 Q16 48 17 52 H7 Q8 48 6 44 Q3 36 9 28 Q11 20 7 14 Q4 8 8 4 Z" fill="#F6EFE0"/>
          <path d="M16 4 Q20 8 17 14 Q13 20 15 28 Q21 36 18 44 Q16 48 17 52 H14 Q15 44 16 36 Q12 28 14 20 Q17 12 15 4 Z" fill="#D8CCB4"/>

      const srcs = await Promise.all(favSets[next].dishes.map(favLoad)); // all three change together
      if (favHold || document.hidden) return;
      favAt = next;
      favTiles.forEach((a, i) => {
        const old = [...a.querySelectorAll('img')];
        const img = document.createElement('img');
        img.className = 'fav-in'; img.alt = ''; img.src = srcs[i];
        a.insertBefore(img, a.querySelector('.cap'));
        requestAnimationFrame(() => requestAnimationFrame(() => img.classList.add('on')));
        setTimeout(() => { old.forEach((o) => o.remove()); img.classList.remove('fav-in', 'on'); }, reduceMotion ? 0 : 900);
      });
      favLabel();
    } finally { favBusy = false; }
  }
  function favSchedule() {
    clearTimeout(favTimer);
    favTimer = setTimeout(async () => { if (!favHold && !document.hidden) await favNext(); favSchedule(); }, FAV_MS);
  }
  const favGrid = document.querySelector('.fav-grid');
  favGrid.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') favHold = true; });
  favGrid.addEventListener('pointerleave', () => { favHold = false; });
  favGrid.addEventListener('focusin', () => { favHold = true; });
  favGrid.addEventListener('focusout', () => { favHold = false; });
  document.querySelectorAll('.fav img').forEach((img) => THL.imgFallback(img));

  // ---------- Start ----------

  const languageSetup = $('#languageSetup');
  function showLanguageSetup() {
    document.querySelectorAll('[data-language-choice]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.languageChoice === THL.lang)));
    if (!languageSetup.open) {
      try { languageSetup.showModal(); }
      catch (_) { languageSetup.setAttribute('open', ''); languageSetup.classList.add('fallback'); }
    }
    languageSetup.querySelector('button').focus();
  }
  languageSetup.addEventListener('cancel', e => e.preventDefault());
  document.querySelectorAll('[data-language-choice]').forEach(b => b.addEventListener('click', () => {
    THL.setLang(b.dataset.languageChoice);
    if (typeof languageSetup.close === 'function') languageSetup.close();
    languageSetup.removeAttribute('open'); languageSetup.classList.remove('fallback');
    startBot();
    $('#changeLanguage').focus();
  }));
  $('#changeLanguage').addEventListener('click', showLanguageSetup);


  THL.init(DICT);
  favLabel(); // the photos start changing once a language is picked (startBot)
  THL.onLang(favLabel);
  THL.onLang(() => { document.querySelectorAll('[data-name-zh-svg]').forEach((n) => { n.textContent = THL.zhName(); }); if (botStarted) greet(true); });
  document.querySelectorAll('[data-name-zh-svg]').forEach((n) => { n.textContent = THL.zhName(); });

  // First visit in this tab: play the doors. Reload in the same tab: straight to the language picker.
  if (introPlayed()) showLanguageSetup(); else playIntro();
})();
</script>
</body>
</html>
