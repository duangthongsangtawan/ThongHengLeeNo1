<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Thong Heng Lee Menu</title>
<meta name="description" content="ท่งเฮงหลี · เมนูและสั่งอาหารจากโต๊ะ · Thong Heng Lee table ordering">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Myanmar:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&family=Noto+Serif+TC:wght@600;700&family=Noto+Serif+SC:wght@600;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/images/logo.jpg">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  body { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }

  /* Page title + table */
  .menu-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 22px; }
  .menu-top h1 { margin: 0; font-family: var(--font-display); font-size: clamp(1.6rem, 4vw, 2.2rem); color: var(--teak-dark); }
  .table-chip { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; border: 2px solid var(--sky); background: var(--paper); color: var(--sky-deep); font-weight: 700; }
  .table-chip:hover { background: var(--sky-soft); }
  .notice { margin: 14px 0 0; padding: 10px 14px; border-radius: 10px; background: #FBEFD2; border: 1px solid #EBCB84; color: var(--teak); font-size: 0.85rem; }

  /* Category tabs */
  .cats { position: sticky; top: 69px; z-index: 30; background: var(--ivory); border-bottom: 1px solid var(--hairline); margin-top: 14px; }
  @media (max-width: 700px) { .cats { top: 112px; } }
  .cats-row { display: flex; gap: 8px; overflow-x: auto; padding-top: 10px; padding-bottom: 10px; scrollbar-width: none; }
  .cats-row::-webkit-scrollbar { display: none; }
  .cat-btn { flex: none; border: 1.5px solid var(--hairline); background: var(--paper); color: var(--teak); padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: 0.92rem; white-space: nowrap; }
  .cat-btn[aria-current="true"] { background: var(--teak); border-color: var(--teak); color: var(--ivory); }

  /* Sections + cards */
  .cat-section { scroll-margin-top: 140px; padding-top: 22px; }
  @media (max-width: 700px) { .cat-section { scroll-margin-top: 230px; } } /* header (2 language rows) + category tabs */
  .cat-section h2 { margin: 0 0 12px; font-family: var(--font-display); font-size: 1.35rem; color: var(--teak-dark); display: flex; align-items: center; gap: 10px; }
  .cat-section h2::after { content: ""; flex: 1; height: 2px; background: linear-gradient(90deg, var(--ochre), transparent); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (min-width: 720px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
  @media (min-width: 1000px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

  .card { display: flex; flex-direction: column; background: var(--paper); border: 2px solid var(--teak); border-radius: 14px; overflow: hidden; box-shadow: 0 4px 0 rgba(92,58,33,0.18); }
  .card .thumb { position: relative; aspect-ratio: 4 / 3; background: var(--ivory-2); overflow: hidden; }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .qty { position: absolute; top: 8px; right: 8px; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 999px; background: var(--sky); color: #fff; font-weight: 700; display: none; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.25); }
  .card.in-cart .qty { display: grid; }
  .card.in-cart { border-color: var(--sky); }
  .card.spotlight { border-color: var(--ochre); animation: spot 1.3s ease-out 3; }
  @keyframes spot { 0% { box-shadow: 0 0 0 0 rgba(226,168,56,0.9); } 100% { box-shadow: 0 0 0 16px rgba(226,168,56,0); } }
  .card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card .name { margin: 0; font-weight: 600; font-size: 0.98rem; line-height: 1.3; }
  .card .price { margin: 0; font-weight: 700; color: var(--teak); font-size: 1.05rem; }
  .card .actions { display: grid; grid-template-columns: 1fr 1.25fr; gap: 10px; margin-top: auto; padding-top: 4px; }
  .card .actions .btn { padding: 10px 6px; font-size: 0.85rem; border-radius: 10px; }
  .card .actions .btn-secondary { border-width: 1.5px; }
  @media (max-width: 380px) { .card .actions { grid-template-columns: 1fr; } }

  /* Sticky order bar */
  .order-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--teak-dark); border-top: 4px solid var(--ochre); padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 24px rgba(0,0,0,0.2); }
  .order-bar .wrap { display: flex; gap: 10px; align-items: stretch; }
  .view-order { flex: 1; justify-content: space-between; padding: 12px 16px; }
  .view-order .count { display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 999px; background: var(--teak-dark); color: var(--ochre-hi); font-size: 0.9rem; }
  .view-order .total { font-size: 1.05rem; flex: none; }
  .view-order { min-width: 0; }
  .view-order .vo-main { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
  .view-order .vo-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .view-order { background: transparent; color: var(--ivory); border: 2px solid rgba(247,242,231,0.35); box-shadow: none; }
  .view-order:hover { background: rgba(247,242,231,0.08); }
  .view-order .count { background: var(--ochre); color: var(--teak-dark); }
  .place-order { flex: none; padding: 12px 22px; }
  .place-order:disabled { opacity: 0.5; cursor: not-allowed; }
  .note-field { display: block; margin-top: 16px; }
  .note-field span { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: var(--teak-dark); }
  .note-field textarea { width: 100%; min-height: 64px; padding: 10px 12px; font: inherit; border: 1.5px solid var(--hairline); border-radius: 10px; background: #fff; resize: vertical; }
  .send-error { margin: 0 20px; padding: 12px 14px; border-radius: 12px; background: #F7E1E1; border: 1.5px solid var(--crimson); color: var(--teak-dark); }
  .send-error strong { display: block; color: var(--crimson); margin-bottom: 4px; }
  .send-error p { margin: 0; font-size: 0.92rem; line-height: 1.5; }
  .sheet.busy .sheet-body { pointer-events: none; opacity: 0.6; }
  .note-field textarea:focus { outline: 3px solid var(--sky); outline-offset: 1px; border-color: var(--sky); }
  .note-field input { width: 100%; min-height: 44px; padding: 10px 12px; font: inherit; border: 1.5px solid var(--hairline); border-radius: 10px; background: #fff; }
  .note-field input:focus { outline: 3px solid var(--sky); outline-offset: 1px; border-color: var(--sky); }
  .name-field { margin-top: 0; }
  .name-hint { margin: 6px 0 16px; font-size: 0.82rem; line-height: 1.45; color: rgba(43,29,20,0.65); }
  .expired { margin: 0 0 14px; padding: 10px 12px; border-radius: 10px; background: #FBEFD2; border: 1px solid #EBCB84; color: var(--teak-dark); font-weight: 600; font-size: 0.92rem; }
  #tableLabel { max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Order sheet */
  .line { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hairline); }
  .line > div { min-width: 0; }
  /* Narrow phones: the (44px) stepper goes under the dish so name, price and egg choice keep their width */
  @media (max-width: 440px) { .line { grid-template-columns: 56px 1fr; align-items: start; } .line .stepper { grid-column: 2; } }
  .line img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; }
  .line .ln { font-weight: 600; line-height: 1.3; }
  .line .lp { color: var(--teak); font-size: 0.9rem; margin-top: 2px; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--teak); background: var(--paper); font-size: 1.25rem; line-height: 1; font-weight: 700; }
  .stepper span { min-width: 22px; text-align: center; font-weight: 700; }
  .egg { display: inline-flex; margin-top: 8px; border: 1.5px solid var(--sky); border-radius: 999px; overflow: hidden; }
  .egg button { min-height: 44px; min-width: 64px; white-space: nowrap; border: 0; background: var(--paper); color: var(--sky-deep); padding: 0 14px; font-size: 0.88rem; font-weight: 600; }
  .egg button[aria-pressed="true"] { background: var(--sky); color: #fff; }
  .sum { display: flex; justify-content: space-between; align-items: baseline; padding-top: 14px; font-weight: 700; font-size: 1.15rem; }
  .empty { text-align: center; color: rgba(43,29,20,0.6); padding: 26px 0; }
  .sent h3 { margin: 22px 0 6px; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--jade); }
  .sent ul { list-style: none; margin: 0; padding: 0; }
  .sent li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 0.92rem; border-bottom: 1px dashed var(--hairline); }
  .sent-order { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--hairline); border-radius: 12px; background: var(--paper); }
  .sent-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 0.85rem; font-weight: 600; color: rgba(43,29,20,0.7); }
  .sent-order .badge { flex: none; padding: 3px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; background: var(--sky-soft); color: var(--sky-deep); }
  .sent-order.s-preparing .badge { background: #FBEFD2; color: #8A5A08; }
  .sent-order.s-served .badge { background: #E3F1E8; color: var(--jade); }
  .sent-order.s-served .badge::before { content: '✓ '; }
  .sent-order.s-cancelled { border-color: var(--crimson); background: #FBF0F0; }
  .sent-order.s-cancelled .badge { background: var(--crimson); color: #fff; }
  .sent-order.s-cancelled .badge::before { content: '✕ '; }
  .sent-order.s-cancelled li span { text-decoration: line-through; opacity: 0.7; }
  .sent-order .cancel-hint { margin: 6px 0 0; font-size: 0.85rem; font-weight: 600; color: var(--crimson); }
  .sent-order li:last-child { border-bottom: 0; }

  /* Photo viewer */
  .photo-img { width: 100%; aspect-ratio: 4 / 3; max-height: 62dvh; object-fit: contain; background: #111; display: block; } /* fixed box: no jump while the photo loads */
  .photo-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px 20px; }
  .photo-meta strong { font-size: 1.05rem; }

  /* Table picker */
  .tables { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tables button { padding: 16px 0; border-radius: 12px; border: 2px solid var(--teak); background: var(--paper); font-weight: 700; font-size: 1.15rem; }
  .tables button[aria-pressed="true"] { background: var(--sky); border-color: var(--sky); color: #fff; }
  /* Cancel sits in the last grid slot (after table 11) so the 4 × 3 grid stays even */
  .tables button.cancel { border-style: dashed; border-color: var(--hairline); background: transparent; color: var(--teak); font-size: 0.9rem; font-weight: 600; padding: 4px 2px; line-height: 1.2; }

  /* Result dialogs */
  .result { text-align: center; padding: 28px 22px 10px; }
  .result .icon { width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; font-size: 2rem; }
  .result .icon.ok { background: #E3F1E8; color: var(--jade); }
  .result .icon.err { background: #F7E1E1; color: var(--crimson); }
  .result h2 { margin: 0 0 8px; font-family: var(--font-display); color: var(--teak-dark); }
  .result p { margin: 0 0 6px; line-height: 1.55; }
  .result .big { font-size: 1.5rem; font-weight: 700; color: var(--teak); margin-top: 10px; }
  .warn { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #FBEFD2; color: var(--teak); font-size: 0.9rem; }
  /* Item options reuse the existing sheet, button, palette and type styles. */
  .option-choices { display: grid; gap: 10px; }
  .option-choice { min-height: 48px; justify-content: space-between; text-align: start; gap: 12px; }
  .option-choice strong { flex: none; }
  .option-choice[aria-pressed="true"] { background: var(--sky); border-color: var(--sky); color: #fff; }
  .option-summary { color: var(--sky-deep); line-height: 1.5; }
  .edit-options { margin-top: 6px; min-height: 44px; padding: 8px 12px; font-size: 0.85rem; }
  .option-input { display: flex; justify-content: flex-start; cursor: pointer; }
  .option-input input { flex: none; width: 22px; height: 22px; margin: 0; accent-color: var(--sky-deep); }
  .option-input.selected { border-color: var(--sky); background: var(--sky-soft); }
  .option-input:focus-within { outline: 2px solid var(--sky-deep); outline-offset: 2px; }
  .photo-stage { position: relative; }
  #photoSheet .photo-img { width: 100%; height: auto; aspect-ratio: auto; max-height: none; }
  .photo-image-wrap { position: relative; min-width: 0; }
  /* Menu notes: a quiet reading rail beside an unobstructed photo. */
  .photo-stage.annotated { display:grid; grid-template-columns:minmax(0, 1.5fr) minmax(130px, 1fr); align-items:center; gap:24px; padding:24px; background:var(--paper); }
  .photo-image-wrap { overflow:hidden; border-radius:12px; }
  .ingredient-overlay { min-width:0; padding-left:20px; border-left:1px solid var(--hairline); }
  .ingredient-overlay[hidden], .ingredient-markers { display:none; }
  .ingredient-heading { margin:0 0 18px; font-size:.72rem; font-weight:600; letter-spacing:.04em; color:var(--teak); }
  .ingredient-callouts { display:flex; flex-direction:column; gap:14px; list-style:none; margin:0; padding:0; }
  .ingredient-callouts li { display:block; color:var(--teak-dark); font-size:1rem; line-height:1.5; overflow-wrap:anywhere; }
  .ingredient-callouts small { display:block; color:var(--teak); font-size:.76rem; margin-top:2px; }
  .ingredient-pending { color:var(--teak); font-size:.85rem; line-height:1.6; }
  @media (max-width:480px) {
    .photo-stage.annotated { grid-template-columns:minmax(0,1.2fr) minmax(112px,1fr); gap:14px; padding:18px 14px; }
    .ingredient-overlay { padding-left:14px; }
    .ingredient-callouts { gap:12px; }
    .ingredient-callouts li { font-size:.9rem; }
  }
  .ingredient-note { margin: 0; padding: 10px 20px 0; font-size: .75rem; color: var(--teak); }
  .ingredient-note[hidden] { display: none; }
  #photoSheet .photo-meta { position: sticky; bottom: 0; background: var(--paper); border-top: 1px solid var(--hairline); }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="index.html">
      <img src="assets/images/logo.jpg" alt="Thong Heng Lee logo">
      <div class="brand-names">
        <div class="en">Thong Heng Lee</div>
        <div class="sub">ท่งเฮงหลี · <span data-name-zh>同興利</span></div>
      </div>
    </a>
    <nav class="langs" aria-label="Language">
      <button type="button" data-lang="th">ไทย</button>
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="zh-Hans">中文</button>
      <button type="button" data-lang="ja">日本語</button>
      <button type="button" data-lang="ko">한국어</button>
      <button type="button" data-lang="my">မြန်မာ</button>
      <button type="button" data-lang="fr">Français</button>
      <button type="button" data-lang="es">Español</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="menu-top">
    <h1 data-i18n="title"></h1>
    <button class="table-chip" type="button" id="tableChip">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 10h18M6 10v10M18 10v10M8 6h8"/></svg>
      <span id="tableLabel"></span>
    </button>
  </div>
  <p class="notice" id="sampleNotice" data-i18n="sample" hidden></p>
  <p class="notice" id="orderNotice" role="status" hidden></p>
</main>

<nav class="cats" aria-label="Categories"><div class="wrap cats-row" id="cats"></div></nav>
<main class="wrap" id="menu"></main>

<footer class="site-footer" id="site-footer"></footer>

<!-- Sticky order bar -->
<div class="order-bar">
  <div class="wrap">
    <button class="btn view-order" type="button" id="viewOrder">
      <span class="vo-main"><span class="count" id="barCount">0</span><span class="vo-label" data-i18n="myOrder"></span></span>
      <span class="total" id="barTotal">฿0</span>
    </button>
    <button class="btn btn-primary place-order" type="button" id="placeOrder" data-i18n="placeOrder" disabled></button>
  </div>
</div>

<!-- Order sheet -->
<dialog class="sheet" id="orderSheet" aria-labelledby="orderTitle">
  <div class="sheet-head"><h2 id="orderTitle" data-i18n="myOrder"></h2><button class="sheet-close" type="button" data-close aria-label="Close">×</button></div>
  <div class="sheet-body">
    <div id="cartLines"></div>
    <div class="sum" id="cartSum"></div>
    <label class="note-field"><span data-i18n="nameLabel"></span><input id="orderName" type="text" maxlength="40" autocomplete="off" enterkeyhint="done" data-i18n-ph="namePh"></label>
    <label class="note-field"><span data-i18n="note"></span><textarea id="orderNote" maxlength="300" rows="2" data-i18n-ph="notePh"></textarea></label>
    <div class="sent" id="sentBox"></div>
  </div>
  <div class="send-error" id="sendError" role="alert" hidden></div>
  <div class="sheet-foot">
    <button class="btn btn-ghost" type="button" data-close data-i18n="keepBrowsing"></button>
    <button class="btn btn-primary" type="button" id="sendOrder" data-i18n="send"></button>
  </div>
</dialog>

<!-- Choose options before this serving enters the basket. -->
<dialog class="sheet" id="optionsSheet" aria-labelledby="optionsTitle" aria-describedby="optionsHint">
  <div class="sheet-head"><h2 id="optionsTitle"></h2><button class="sheet-close" type="button" data-close aria-label="Close">×</button></div>
  <div class="sheet-body">
    <p id="optionsHint" class="name-hint"></p>
    <div id="optionChoices" class="option-choices"></div>
    <div class="sum"><span data-i18n="total"></span><strong id="optionsTotal"></strong></div>
  </div>
  <div class="sheet-foot">
    <button class="btn btn-ghost" id="cancelOptions" type="button" data-close></button>
    <button class="btn btn-primary" id="confirmOptions" type="button"></button>
  </div>
</dialog>

<!-- Photo viewer -->
<dialog class="sheet" id="photoSheet" aria-labelledby="photoName">
  <div class="sheet-head"><h2 id="photoName"></h2><button class="sheet-close" type="button" data-close aria-label="Close">×</button></div>
  <div class="photo-stage" id="photoStage">
    <div class="photo-image-wrap">
      <img class="photo-img" id="photoImg" alt="">
      <div id="photoMarkers" class="ingredient-markers" aria-hidden="true" hidden></div>
    </div>
    <div id="photoIngredients" class="ingredient-overlay" hidden></div>
  </div>
  <p id="ingredientNote" class="ingredient-note" hidden></p>
  <div class="photo-meta"><strong id="photoPrice"></strong><button class="btn btn-primary" type="button" id="photoAdd"></button></div>
</dialog>

<!-- Table picker -->
<dialog class="sheet" id="tableSheet" aria-labelledby="tableTitle">
  <div class="sheet-head"><h2 id="tableTitle" data-i18n="pickTable"></h2></div>
  <div class="sheet-body">
    <p class="expired" id="tableExpired" data-i18n="tableExpired" role="alert" hidden></p>
    <label class="note-field name-field"><span data-i18n="nameLabel"></span><input id="tableName" type="text" maxlength="40" autocomplete="off" enterkeyhint="done" data-i18n-ph="namePh"></label>
    <p class="name-hint" data-i18n="nameHint"></p>
    <p data-i18n="pickTableHint" style="margin:0 0 14px"></p><div class="tables" id="tables"></div>
  </div>
</dialog>

<!-- Order result -->
<dialog class="sheet" id="resultSheet">
  <div id="resultBody"></div>
</dialog>

<script src="assets/js/site-config.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/menu-data.js"></script>
<script src="assets/js/ingredients-data.js"></script>
<script src="assets/js/menu.js"></script>
</body>
</html>
