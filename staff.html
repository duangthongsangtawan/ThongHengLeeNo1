<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thong Heng Lee Staff</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@600;700&family=Noto+Sans+TC:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+Myanmar:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/images/logo.jpg">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 22px; }
  .top h1 { margin: 0; font-family: var(--font-display); color: var(--teak-dark); font-size: 1.8rem; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tools .btn { padding: 10px 14px; font-size: 0.9rem; }
  .tools .btn.attention { background: var(--ochre); color: var(--teak-dark); border-color: var(--ochre); animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 50% { box-shadow: 0 0 0 5px rgba(226,168,56,0.35); } }
  .status { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; background: var(--ivory-2); }
  .status i { width: 10px; height: 10px; border-radius: 50%; background: #999; }
  .status.live i { background: #2FA360; box-shadow: 0 0 0 4px rgba(47,163,96,0.2); }
  .status.demo i { background: var(--ochre); }
  .status.offline i, .status.auth i { background: var(--crimson); }
  .seg { display: inline-flex; border: 1.5px solid var(--teak); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: var(--paper); color: var(--teak); padding: 9px 12px; font-size: 0.85rem; font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--teak); color: var(--ivory); }

  /* Board: New -> Preparing -> Done */
  .board { display: grid; gap: 18px; margin-top: 20px; align-items: start; }
  @media (min-width: 900px) { .board { grid-template-columns: 1.2fr 1.2fr 1fr; } }
  .col h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 1.1rem; color: var(--teak-dark); }
  .col h2 .n { display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 8px; border-radius: 999px; color: #fff; font-size: 0.9rem; }
  .col-new h2 .n { background: #D9531E; }
  .col-prep h2 .n { background: var(--ochre-deep); }
  .col-done h2 .n { background: var(--jade); }
  .col .sum-line { margin: -6px 0 12px; font-size: 0.85rem; color: rgba(43,29,20,0.65); }
  .list { display: flex; flex-direction: column; gap: 12px; }
  .group { margin: 6px 0 -4px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(43,29,20,0.55); }

  .ticket { background: var(--paper); border: 2px solid var(--teak); border-left-width: 8px; border-radius: 14px; padding: 14px 16px; box-shadow: 0 4px 0 rgba(92,58,33,0.15); }
  .ticket.s-new { border-color: #D9531E; background: #FFF3EC; }
  .ticket.s-served { border-color: var(--ochre); background: #FFF9E6; }
  .ticket.s-paid { border-color: var(--jade); background: #F1F8F3; padding: 10px 14px; }
  .ticket.s-cancelled { border-color: #9A9A9A; background: #F3F2F0; padding: 10px 14px; opacity: 0.8; }
  .ticket.s-cancelled .t-items { text-decoration: line-through; }
  .ticket.fresh { animation: flash 1.1s ease-out 3; }
  @keyframes flash { 50% { box-shadow: 0 0 0 7px rgba(217,83,30,0.45); } }
  .t-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .t-table { font-size: 1.5rem; font-weight: 700; color: var(--teak-dark); }
  .t-who { display: inline-flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .t-name { padding: 2px 10px; border-radius: 999px; background: var(--sky-soft); color: var(--sky-deep); font-weight: 700; font-size: 1rem; overflow-wrap: anywhere; }
  .s-served .t-name, .s-cancelled .t-name { font-size: 0.85rem; }
  .s-served .t-table, .s-cancelled .t-table { font-size: 1.1rem; }
  .t-meta { font-size: 0.85rem; color: rgba(43,29,20,0.65); }
  .t-meta .late { color: var(--crimson); font-weight: 700; }
  .t-items { list-style: none; margin: 10px 0 6px; padding: 0; }
  .t-items li { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--hairline); }
  .t-items .q { font-weight: 700; font-size: 1.15rem; min-width: 34px; }
  .t-items .th { font-weight: 600; font-size: 1.08rem; line-height: 1.35; }
  .t-items .no { margin-left: 6px; font-size: 0.75rem; font-weight: 500; color: rgba(43,29,20,0.62); white-space: nowrap; font-variant-numeric: tabular-nums; } /* menu number, as on menu.html */
  .t-items .sub { display: block; font-size: 0.8rem; color: rgba(43,29,20,0.6); }
  .t-items li > div { min-width: 0; }
  .t-items .opt { max-width: 100%; overflow-wrap: anywhere; display: inline-block; margin-left: 6px; padding: 1px 9px; border-radius: 999px; background: #FBE3A6; font-size: 0.85rem; font-weight: 600; vertical-align: 2px; }
  .s-served .t-items li, .s-cancelled .t-items li { padding: 3px 0; border: 0; }
  .s-served .t-items .th, .s-cancelled .t-items .th { font-size: 0.95rem; font-weight: 500; }
  .s-served .sub, .s-cancelled .sub { display: none; }
  .t-note { margin: 8px 0 4px; padding: 8px 12px; border-radius: 10px; background: #FFE9A8; border: 1.5px solid var(--ochre); font-weight: 600; white-space: pre-wrap; }
  .t-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; font-size: 0.9rem; }
  .t-total { font-weight: 700; font-size: 1.05rem; }
  .t-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .t-actions .btn { padding: 11px 14px; font-size: 0.95rem; }
  .act-prep { background: var(--ochre); color: var(--teak-dark); border: 0; flex: 1; }
  .act-prep:hover { background: var(--ochre-hi); }
  .act-served { background: var(--jade); color: #fff; border: 0; flex: 1; }
  .act-served:hover { background: #2F6444; }
  .act-cancel, .act-undo { background: transparent; color: rgba(43,29,20,0.7); border: 1.5px solid var(--hairline); }
  .act-cancel:hover { color: var(--crimson); border-color: var(--crimson); }
  .s-served .t-actions, .s-cancelled .t-actions { margin-top: 6px; }
  .s-served .t-actions .btn, .s-cancelled .t-actions .btn { padding: 6px 12px; font-size: 0.8rem; }
  /* Bill card: one guest's served orders added up (billCard in staff.js) */
  .b-order { padding: 8px 0 4px; border-top: 1px dashed var(--hairline); }
  .t-head + .b-order { border-top: 0; }
  .b-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 0.85rem; color: rgba(43,29,20,0.65); }
  .b-head b { font-size: 0.95rem; color: var(--teak-dark); }
  .b-order .t-items { margin: 4px 0 2px; }
  .bill .t-foot { margin-top: 10px; padding-top: 10px; border-top: 2px solid var(--ochre); }
  .bill .t-total { font-size: 1.2rem; }
  .bill .t-pay .btn { padding: 11px 14px; font-size: 0.95rem; }
  .t-more, .t-wait { margin: 8px 0 2px; padding: 6px 10px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; overflow-wrap: anywhere; }
  .t-more { background: var(--sky-soft); color: var(--sky-deep); }
  .t-wait { background: #FBEFD2; border: 1px solid #EBCB84; color: var(--teak-dark); }
  .empty { padding: 28px; text-align: center; border: 2px dashed var(--hairline); border-radius: 14px; color: rgba(43,29,20,0.55); }
  .note { margin-top: 22px; font-size: 0.85rem; color: rgba(43,29,20,0.6); }

  /* Sign-in */
  .login { padding: 26px 22px 22px; }
  .login .lock { width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%; display: grid; place-items: center; background: var(--sky-soft); color: var(--sky-deep); }
  .login h2 { margin: 0 0 6px; text-align: center; font-family: var(--font-display); color: var(--teak-dark); }
  .login p { margin: 0 0 16px; text-align: center; color: rgba(43,29,20,0.7); }
  .login label { display: block; font-weight: 600; margin-bottom: 6px; }
  .login input { width: 100%; padding: 14px; font: inherit; font-size: 1.1rem; border: 2px solid var(--teak); border-radius: 12px; background: #fff; }
  .login input:focus { outline: 3px solid var(--sky); outline-offset: 1px; }
  .login .err { min-height: 1.4em; margin: 8px 0 0; color: var(--crimson); font-weight: 600; text-align: left; }
  .login .btn { width: 100%; margin-top: 12px; }
  .login input + label { margin-top: 14px; }
  .conn-banner { position: sticky; top: 0; z-index: 60; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; padding: 12px max(16px, calc((100vw - 1064px) / 2)); background: var(--crimson); color: #fff; box-shadow: 0 6px 18px rgba(168,36,36,0.35); animation: pulse-bg 2s ease-in-out infinite; }
  .conn-banner[hidden] { display: none; } /* display:flex above would otherwise override [hidden] */
  .conn-banner strong { font-size: 1.05rem; }
  .conn-banner span { font-size: 0.9rem; opacity: 0.95; }
  .conn-banner .last { font-weight: 700; }
  @keyframes pulse-bg { 50% { background: #8C1A1A; } }
  @media (prefers-reduced-motion: reduce) { .conn-banner { animation: none; } }
  body.conn-lost .board { opacity: 0.55; }
  #loginSheet[hidden] { display: none !important; }
  body.locked #staffContent, #staffContent[hidden] { display: none !important; }
  /* Visible login fallback before JS loads, and if native modal opening fails. */
  body.locked::after { content: ''; position: fixed; inset: 0; z-index: 100; background: rgba(43,29,20,0.55); backdrop-filter: blur(2px); }
  body.locked #loginSheet[open] { position: fixed; inset: 0; margin: auto; z-index: 101; display: block; height: fit-content; }


  /* Tabs */
  .tabs { display: flex; gap: 6px; margin-top: 18px; border-bottom: 2px solid var(--hairline); }
  .tabs button { position: relative; display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 12px 16px; font-weight: 700; font-size: 1rem; color: rgba(43,29,20,0.6); border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .tabs button[aria-selected="true"] { color: var(--teak-dark); border-bottom-color: var(--teak); }
  .tabs .badge { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: #D9531E; color: #fff; font-size: 0.8rem; }
  .tabs .badge:empty { display: none; }
  /* Phones: keep each tab label on one line; the row scrolls sideways if it has to */
  @media (max-width: 600px) { .tabs { overflow-x: auto; scrollbar-width: none; } .tabs button { flex: none; white-space: nowrap; padding: 12px 10px; font-size: 0.92rem; } }
  .panel-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; margin-top: 14px; }
  .panel-tools .btn { padding: 10px 14px; font-size: 0.9rem; }
  .panel-tools .btn.attention { background: var(--ochre); color: var(--teak-dark); border-color: var(--ochre); animation: nudge 1.6s ease-in-out infinite; }

  /* Tables tab: running total per name */
  .tables-grid { display: grid; gap: 16px; margin-top: 14px; align-items: start; }
  @media (min-width: 700px) { .tables-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); } }
  .table-card { background: var(--paper); border: 2px solid var(--teak); border-radius: 14px; padding: 14px 16px 6px; box-shadow: 0 4px 0 rgba(92,58,33,0.15); }
  .tc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-bottom: 8px; border-bottom: 2px solid var(--hairline); }
  .tc-head h3 { margin: 0; font-size: 1.35rem; color: var(--teak-dark); }
  .tc-total { font-size: 0.9rem; font-weight: 600; color: rgba(43,29,20,0.65); font-variant-numeric: tabular-nums; }
  .tc-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--hairline); }
  .tc-row:last-child { border-bottom: 0; }
  .tc-who { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .tc-who strong { font-size: 1.15rem; color: var(--sky-deep); overflow-wrap: anywhere; }
  .no-name .tc-who strong { color: rgba(43,29,20,0.55); font-style: italic; font-weight: 600; }
  .tc-meta { font-size: 0.82rem; color: rgba(43,29,20,0.65); font-variant-numeric: tabular-nums; }
  .tc-open { align-self: flex-start; margin-top: 2px; padding: 1px 8px; border-radius: 999px; background: #FBEFD2; color: #8A5A08; font-size: 0.78rem; font-weight: 700; }
  .tc-amt { flex: none; font-size: 1.45rem; font-weight: 700; color: var(--teak-dark); font-variant-numeric: tabular-nums; }

  /* Sales (売上集計) */
  :root { --food: #B97C12; --drink: #2F78A8; }
  .datebar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
  .datebar input[type="date"] { padding: 9px 12px; font: inherit; font-weight: 600; border: 1.5px solid var(--teak); border-radius: 10px; background: #fff; color: var(--ink); }
  .datebar .btn { padding: 9px 14px; font-size: 0.9rem; }
  .datebar .icon-btn { width: 42px; padding: 9px 0; justify-content: center; }
  .recent { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; font-size: 0.85rem; color: rgba(43,29,20,0.65); }
  .recent button { border: 1px solid var(--hairline); background: var(--paper); border-radius: 999px; padding: 4px 10px; font-size: 0.8rem; color: var(--teak); }
  .recent button[aria-pressed="true"] { background: var(--teak); color: var(--ivory); border-color: var(--teak); }
  .sales-grid { display: grid; gap: 16px; margin-top: 16px; }
  @media (min-width: 900px) { .sales-grid { grid-template-columns: 1fr 1fr; } .sales-grid .wide { grid-column: 1 / -1; } }
  .card-s { background: var(--paper); border: 1px solid var(--hairline); border-radius: 16px; padding: 18px 20px; box-shadow: var(--shadow); }
  .card-s h3 { margin: 0 0 12px; font-size: 1rem; color: var(--teak-dark); }
  .hero { display: grid; gap: 18px; align-items: center; }
  @media (min-width: 700px) { .hero { grid-template-columns: 1.1fr 1fr 1fr; } }
  .kpi .label { font-size: 0.85rem; font-weight: 600; color: rgba(43,29,20,0.65); }
  .kpi .value { font-size: 2.4rem; font-weight: 700; color: var(--teak-dark); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi .value.small { font-size: 1.6rem; }
  .kpi .sub { font-size: 0.9rem; color: rgba(43,29,20,0.7); margin-top: 4px; }
  .kpi .key { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }
  .split { display: flex; gap: 2px; height: 14px; margin-top: 14px; }
  .split span { border-radius: 4px; min-width: 4px; }
  .split .f { background: var(--food); } .split .d { background: var(--drink); }
  .cat-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  .cat-table th, .cat-table td { padding: 8px 6px; border-bottom: 1px solid var(--hairline); text-align: left; }
  .cat-table th { font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; color: rgba(43,29,20,0.6); }
  .cat-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cat-table tfoot td { font-weight: 700; border-bottom: 0; }
  .board-top { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .board-top li { display: grid; grid-template-columns: 34px 52px 1fr; gap: 12px; align-items: center; }
  .board-top .medal { font-size: 1.6rem; text-align: center; }
  .board-top img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: var(--ivory-2); }
  .board-top .nm { font-weight: 700; line-height: 1.3; }
  .board-top .en { font-size: 0.8rem; color: rgba(43,29,20,0.6); }
  .board-top .bar { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .board-top .bar i { display: block; height: 10px; border-radius: 0 4px 4px 0; min-width: 4px; }
  .board-top .bar b { font-size: 0.85rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .top-food .bar i { background: var(--food); } .top-drink .bar i { background: var(--drink); }
  .muted { color: rgba(43,29,20,0.6); font-size: 0.9rem; }
  .sales-note { margin-top: 14px; font-size: 0.85rem; color: rgba(43,29,20,0.6); }
</style>
</head>
<body class="locked">

<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="index.html">
      <img src="assets/images/logo.jpg" alt="Thong Heng Lee logo">
      <div class="brand-names">
        <div class="en">Thong Heng Lee</div>
        <div class="sub">ท่งเฮงหลี · <span data-name-zh>同興利</span></div>
      </div>
    </a>
    <nav class="langs" aria-label="Language">
      <button type="button" data-lang="th">ไทย</button>
      <button type="button" data-lang="en">English</button>
    </nav>
  </div>
</header>

<div class="conn-banner" id="connBanner" role="alert" hidden></div>

<main class="wrap" id="staffContent" hidden inert>
  <div class="top">
    <h1 data-i18n="title"></h1>
    <div class="tools">
      <span class="status" id="status"><i></i><span id="statusText"></span></span>
      <button class="btn btn-ghost" type="button" id="logoutBtn" data-i18n="logout"></button>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabKitchen" aria-controls="panelKitchen"><span aria-hidden="true">🍳</span><span data-i18n="tabKitchen"></span><span class="badge" id="tabBadge"></span></button>
    <button type="button" role="tab" id="tabTables" aria-controls="panelTables"><span aria-hidden="true">🪑</span><span data-i18n="tabTables"></span></button>
    <button type="button" role="tab" id="tabSales" aria-controls="panelSales"><span aria-hidden="true">📊</span><span data-i18n="tabSales"></span></button>
  </div>

  <section id="panelKitchen" role="tabpanel" aria-labelledby="tabKitchen">
  <div class="panel-tools">
    <div class="seg" role="group" data-i18n-aria="sortBy">
      <button type="button" id="byTime" data-i18n="byTime"></button>
      <button type="button" id="byTable" data-i18n="byTable"></button>
    </div>
    <button class="btn btn-ghost" type="button" id="soundBtn"></button>
  </div>

  <div class="board">
    <section class="col col-new" aria-labelledby="newH">
      <h2 id="newH"><span aria-hidden="true">🔥</span> <span data-i18n="colNew"></span> <span class="n" id="newCount">0</span></h2>
      <div class="list" id="newList"></div>
    </section>
    <section class="col col-prep" aria-labelledby="prepH">
      <h2 id="prepH"><span aria-hidden="true">✓</span> <span data-i18n="colPrep"></span> <span class="n" id="prepCount">0</span></h2>
      <div class="list" id="prepList"></div>
    </section>
    <section class="col col-done" aria-labelledby="doneH">
      <h2 id="doneH"><span aria-hidden="true">✓</span> <span data-i18n="colDone"></span> <span class="n" id="doneCount">0</span></h2>
      <p class="sum-line" id="doneSum"></p>
      <div class="list" id="doneList"></div>
    </section>
  </div>
  </section>

  <section id="panelTables" role="tabpanel" aria-labelledby="tabTables" hidden>
    <p class="sales-note" data-i18n="tablesNote"></p>
    <div id="tablesBody"></div>
  </section>

  <section id="panelSales" role="tabpanel" aria-labelledby="tabSales" hidden>
    <div class="datebar">
      <button class="btn btn-ghost icon-btn" type="button" id="prevDay" data-i18n-aria="prevDay">‹</button>
      <input type="date" id="salesDate" data-i18n-aria="pickDate">
      <button class="btn btn-ghost icon-btn" type="button" id="nextDay" data-i18n-aria="nextDay">›</button>
      <button class="btn btn-secondary" type="button" id="todayBtn" data-i18n="today"></button>
    </div>
    <div class="recent" id="recentDays"></div>
    <div id="salesBody"></div>
  </section>
  <p class="note" data-i18n="note"></p>
</main>

<dialog class="sheet" id="loginSheet" aria-labelledby="loginTitle" aria-modal="true" open>
  <form class="login" id="loginForm" method="dialog">
    <div class="lock" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
    <h2 id="loginTitle" data-i18n="loginTitle">เข้าสู่ระบบพนักงาน</h2>
    <p data-i18n="loginHint">ใส่ชื่อผู้ใช้และรหัสผ่านพนักงาน</p>
